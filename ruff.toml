# Deliberately a ruff.toml and not a pyproject.toml: adding a pyproject.toml to
# the repo root changes how Railway's Python builder detects the project, and
# this repo deploys straight from a push. Keep the deploy path untouched.
#
# The rule set is pinned explicitly rather than relying on ruff's default select,
# which widens between releases — a floating default would turn CI red on an
# unrelated day.

target-version = "py311"
line-length = 120
exclude = ["tests/__snapshots__"]

[lint]
select = [
    "E4",   # imports
    "E7",   # statement-level mistakes
    "E9",   # syntax / IO errors
    "F",    # pyflakes: undefined names, unused imports, bad f-strings
    "T20",  # flake8-print: no print() — diagnostics go through logging, which
            # has levels, timestamps and the per-update correlation ID. Every
            # print in the codebase was migrated; this keeps them from creeping
            # back one convenient debug line at a time.
]

ignore = [
    "E701",  # aligned one-line if/else blocks are a deliberate style here
             # (see blocks_to_text in notion_client.py)
]

[lint.per-file-ignores]
# notion_ids.py has a __main__ block that exists precisely to print the
# diagnostic report to stdout when run as a script instead of via Telegram.
"notion_ids.py" = ["T201"]
