name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # PINNED, both the action and the model: `@v1` is a moving tag, and a
        # new release can change the action and its default model with nobody
        # reviewing it. This SHA is what `v1` pointed at for the reviews that
        # last passed, and the model is the one they ran. Bump both on purpose,
        # in a PR of their own. That PR's own review SKIPS (the action refuses a
        # workflow file that differs from main's), so it is verified on the
        # next PR after merge.
        #
        # A review that fails in ~2 s with is_error, no tokens and $0 spent is
        # the CREDENTIAL, not the pin: check CLAUDE_CODE_OAUTH_TOKEN first
        # (`claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).
        # On 2026-10-02 an expired token looked exactly like a broken release,
        # and pinning the release changed nothing until the token was replaced.
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790  # v1 as of 2026-09-27
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-5'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

