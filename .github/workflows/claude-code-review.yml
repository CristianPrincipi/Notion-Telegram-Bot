name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # PINNED, both the action and the model: `@v1` is a moving tag, and a
        # new release can change the action and its default model with nobody
        # reviewing it. This SHA is what `v1` pointed at for the reviews that
        # last passed, and the model is the one they ran. Bump both on purpose,
        # in a PR of their own. That PR's own review SKIPS (the action refuses a
        # workflow file that differs from main's), so it is verified on the
        # next PR after merge.
        #
        # A review that fails in ~2 s with is_error, no tokens and $0 spent is
        # the CREDENTIAL, not the pin: check CLAUDE_CODE_OAUTH_TOKEN first
        # (`claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).
        # On 2026-10-02 an expired token looked exactly like a broken release,
        # and pinning the release changed nothing until the token was replaced.
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790  # v1 as of 2026-09-27
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # WITHOUT `--comment` AND `--allowedTools` THE REVIEW IS MUTE. The
          # plugin posts nothing unless its prompt ends in `--comment`: it prints
          # what it found to the terminal, which here is this job's log, where
          # the action hides it. And the action installs the inline-comment
          # server only when `--allowedTools` names its tool, so `--comment`
          # alone could say "No issues found" but could not post a finding.
          # Until 2026-10-03 this workflow had neither: 53 runs, 50 of them
          # green, and not one comment on any pull request. The tools listed are
          # the ones the plugin's own command declares.
          #
          # So a green check is not the review's answer; its COMMENT is. A run
          # that leaves no comment has reported nothing.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Show what the review concluded
        # The action hides the run's output, so a review that stopped in its
        # first step and one that read everything and found nothing look the
        # same from here: green, and silent. 5 of the 12 reviews before this
        # step ended in ~20 s without reviewing, and nothing said why.
        #
        # This prints the run's FINAL MESSAGE and the tool calls it was
        # REFUSED, and nothing else. Not the transcript: that can carry any
        # tool's output into a public log, which is why the action hides it.
        # It never fails the job - it reports, the checks decide.
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json
          import os

          path = os.environ.get("EXECUTION_FILE", "")
          if not path or not os.path.isfile(path):
              print("No execution file: the action skipped this pull request, or failed before running Claude.")
              raise SystemExit(0)

          try:
              with open(path, encoding="utf-8") as handle:
                  messages = json.load(handle)
              result = [m for m in messages if isinstance(m, dict) and m.get("type") == "result"][-1]
          except Exception as error:
              print(f"Could not read the review's result: {error!r}")
              raise SystemExit(0)


          def clip(text, limit):
              text = str(text)
              if len(text) <= limit:
                  return text
              return f"{text[:limit]} ... [{len(text) - limit} more characters]"


          print(f"Review ended: {result.get('subtype')}, {result.get('num_turns')} turns.")
          print("Final message:")
          print(clip(result.get("result") or "(none)", 4000))

          denials = result.get("permission_denials") or []
          print(f"\nTool calls refused: {len(denials)}")
          for denial in denials:
              tool_input = json.dumps(denial.get("tool_input"), ensure_ascii=False)
              print(f"- {denial.get('tool_name')}: {clip(tool_input, 1500)}")
          PY

